name: AI Macro Automation

on:
  workflow_dispatch:
    inputs:
      allow_paid:
        description: Allow this manual run to make bounded OpenAI calls
        required: true
        type: boolean
        default: false
      publish:
        description: Allow this manual run to publish a fully validated result
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '17 5 * * *'
      timezone: 'America/New_York'

permissions:
  contents: write

concurrency:
  group: ai-macro-production-automation
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_MACRO_MODE: automation
      AI_MACRO_TRIGGER: ${{ github.event_name }}
      AI_MACRO_AUTOMATION_ENABLED: ${{ vars.AI_MACRO_AUTOMATION_ENABLED || 'false' }}
      OPENAI_AUTOMATION_ENABLED: ${{ vars.OPENAI_AUTOMATION_ENABLED || 'false' }}
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
      AI_MACRO_MAX_PAID_CALLS_PER_RUN: ${{ vars.AI_MACRO_MAX_PAID_CALLS_PER_RUN || '2' }}
      AI_MACRO_MAX_PAID_CALLS_PER_DAY: ${{ vars.AI_MACRO_MAX_PAID_CALLS_PER_DAY || '4' }}
      AI_MACRO_MANUAL_ALLOW_PAID: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_paid || false }}
      AI_MACRO_MANUAL_ALLOW_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}

    steps:
      - name: Check out retained publication state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Run bounded research automation
        id: automation
        shell: bash
        run: |
          set +e
          python -m automation.runner
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Read publication decision
        id: decision
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          status_path = Path('automation_artifacts/status.json')
          status = json.loads(status_path.read_text()) if status_path.exists() else {}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"publish_ready={'true' if status.get('publish_ready') else 'false'}\n")
              out.write(f"result={status.get('result', 'missing')}\n")
          PY

      - name: Preserve paid attempts for audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-macro-automation-${{ github.run_id }}
          path: |
            automation_artifacts/status.json
            openai_artifacts/attempts/
            openai_artifacts/current.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit validated publication transaction
        if: steps.decision.outputs.publish_ready == 'true'
        shell: bash
        run: |
          git config user.name "ai-macro-automation"
          git config user.email "ai-macro-automation@users.noreply.github.com"
          git add data/ archive/ openai_artifacts/current.json automation_artifacts/
          if ! git diff --cached --quiet; then
            git commit -m "automation: publish validated AI Macro refresh"
            git push
          fi

      - name: Persist automation ledger only
        if: steps.decision.outputs.publish_ready != 'true' && steps.decision.outputs.result != 'disabled'
        shell: bash
        run: |
          git config user.name "ai-macro-automation"
          git config user.email "ai-macro-automation@users.noreply.github.com"
          git add automation_artifacts/ || true
          if ! git diff --cached --quiet; then
            git commit -m "automation: record AI Macro run"
            git push
          fi

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          status_path = Path('automation_artifacts/status.json')
          status = json.loads(status_path.read_text()) if status_path.exists() else {}
          paid = status.get('paid_calls') or {}
          lines = [
              '# AI Macro automation',
              '',
              f"- Result: `{status.get('result', 'missing')}`",
              f"- Publish ready: `{bool(status.get('publish_ready'))}`",
              f"- Paid calls this run: `{paid.get('this_run', 0)}`",
              f"- Paid calls today: `{paid.get('today_after_run', paid.get('today_before_run', 0))}/{paid.get('daily_ceiling', 0)}`",
              f"- Evidence snapshot: `{status.get('evidence_snapshot_id', '')}`",
          ]
          warnings = status.get('warnings') or []
          errors = status.get('errors') or []
          if warnings:
              lines.extend(['', '## Warnings', *[f'- {item}' for item in warnings]])
          if errors:
              lines.extend(['', '## Errors', *[f'- {item}' for item in errors]])
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Fail closed after recording diagnostics
        if: steps.automation.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "AI Macro automation stopped safely: ${{ steps.decision.outputs.result }}"
          exit "${{ steps.automation.outputs.exit_code }}"
