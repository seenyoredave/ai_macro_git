name: AI Macro scheduled publication

on:
  schedule:
    - cron: '0 8 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      allow_paid:
        description: Permit the bounded two-call OpenAI generation when evidence is material
        required: true
        default: false
        type: boolean
      publish:
        description: Permit publication to main when the transaction completes
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ai-macro-publication
  cancel-in-progress: false

jobs:
  refresh-generate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out publication state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Publish automation refresh lock
        run: |
          git config user.name ai-macro-automation
          git config user.email ai-macro-automation@users.noreply.github.com
          git tag -f -a ai-macro-automation-refresh-lock -m "AI Macro automation refresh active"
          git push --force origin refs/tags/ai-macro-automation-refresh-lock

      - name: Run ordered publication transaction
        id: runner
        shell: bash
        env:
          AI_MACRO_MODE: automation
          AI_MACRO_TRIGGER: ${{ github.event_name }}
          AI_MACRO_AUTOMATION_ENABLED: ${{ vars.AI_MACRO_AUTOMATION_ENABLED }}
          OPENAI_AUTOMATION_ENABLED: ${{ vars.OPENAI_AUTOMATION_ENABLED }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          AI_MACRO_MANUAL_ALLOW_PAID: ${{ inputs.allow_paid || false }}
          AI_MACRO_MANUAL_ALLOW_PUBLISH: ${{ inputs.publish || false }}
          AI_MACRO_MAX_PAID_CALLS_PER_RUN: ${{ vars.AI_MACRO_MAX_PAID_CALLS_PER_RUN }}
          AI_MACRO_MAX_PAID_CALLS_PER_DAY: ${{ vars.AI_MACRO_MAX_PAID_CALLS_PER_DAY }}
          AI_MACRO_OPENAI_REASONING: xhigh
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          set +e
          python -m automation.runner
          runner_exit=$?
          echo "exit_code=${runner_exit}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Resolve publication decision
        id: decision
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("automation_artifacts/status.json")
          status = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          result = str(status.get("result") or "missing_status")
          publish_ready = bool(status.get("publish_ready"))
          mode = "publication" if publish_ready else "ledger"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"result={result}\n")
              handle.write(f"publish_ready={'true' if publish_ready else 'false'}\n")
              handle.write(f"mode={mode}\n")
          PY

      - name: Commit and push transaction
        if: always() && steps.decision.outputs.result != 'disabled'
        run: python -m automation.git_transport ${{ steps.decision.outputs.mode }}

      - name: Upload bounded diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-macro-automation-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            automation_artifacts/status.json
            automation_artifacts/runs.jsonl
            automation_artifacts/call_journal.jsonl
            automation_artifacts/retained_state_manifest.json
            openai_artifacts/attempts/*.json

      - name: Refresh timings
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          status_path = Path("automation_artifacts/status.json")
          status = json.loads(status_path.read_text(encoding="utf-8")) if status_path.exists() else {}
          phases = status.get("phases") or {}
          refresh = phases.get("deterministic_refresh") or {}
          lines = ["## AI Macro automation", "", f"Result: `{status.get('result', 'missing')}`", "", "### Refresh timings"]
          for label, seconds in (refresh.get("subphases") or {}).items():
              lines.append(f"- {label}: `{seconds}s`")
          lines.extend(["", f"Paid calls this run: `{(status.get('paid_calls') or {}).get('this_run', 0)}`"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Release automation refresh lock
        if: always()
        shell: bash
        run: git push origin :refs/tags/ai-macro-automation-refresh-lock || true

      - name: Fail after publishing diagnostics
        if: always() && steps.runner.outputs.exit_code != '0'
        shell: bash
        run: exit "${{ steps.runner.outputs.exit_code }}"
