name: PE institutional capacity probe

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 1 * *'

permissions:
  contents: read

concurrency:
  group: pe-institutional-capacity-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'

      - name: Validate aggregation contracts
        run: python helpers/pe_institutional_capacity_smoke_test.py

      - name: Fetch public pension allocations
        run: python -m loaders.pe_institutional_capacity_probe

      - name: Summarize extraction
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path
          path = Path('pe_probe_output/institutional_capacity/public_pension_pe_allocation_annual.csv')
          lines = ['## U.S. public pension PE capacity', '']
          if path.exists():
              with path.open(newline='', encoding='utf-8') as handle:
                  data = list(csv.DictReader(handle))
              lines.extend(['| Fiscal year | PE-targeted plans | Above target | Portfolio-proxy units | Proxy above target | Same-plan shift (pp) | Coverage |', '|---|---:|---:|---:|---:|---:|---|'])
              for row in data[-6:]:
                  eligible = row['signal_eligible'] == '1'
                  shift = row['paired_change_pp'] if eligible else '—'
                  status = row['coverage_status']
                  if status == 'incomplete':
                      status += f" ({row['reporting_coverage_ratio']}x prior sample)"
                  lines.append(f"| {row['fiscal_year']} | {row['pe_targeted_plans']} | {row['over_target_pct']}% | {row['portfolio_proxy_units']} | {row['portfolio_proxy_over_target_pct']}% | {shift} | {status} |")
              usable = [r for r in data if r['signal_eligible'] == '1']
              if usable:
                  lines.append(f"\nLatest signal-eligible year: **{usable[-1]['fiscal_year']}**. Newer incomplete years are excluded from directional readings.\n")
          else:
              lines.append('No validated candidate observations; inspect the retrieval log.')
          lines.extend(['', 'Public Plans Database; U.S. public pensions. Above-target rates include only plans with valid positive PE targets. Portfolio-proxy figures group matching three-year allocation histories within sponsor prefixes; common pool ownership is not verified. Candidate only.'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines) + '\n')
          PY

      - name: Upload validated candidate CSVs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pe-institutional-capacity-${{ github.run_id }}
          path: pe_probe_output/institutional_capacity/*.csv
          if-no-files-found: warn
          retention-days: 14
