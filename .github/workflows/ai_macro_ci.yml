name: AI Macro code checks

on:
  push:
    paths:
      - '*.py'
      - '**/*.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'language/*.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '*.py'
      - '**/*.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'language/*.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-macro-code-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install checks
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          ai_macro.py analytics automation config helpers loaders rendering tooling water

      - name: Run deterministic smoke suite
        shell: bash
        run: |
          set -euo pipefail
          python helpers/adoption_depth_smoke_test.py
          python helpers/application_import_smoke_test.py
          python helpers/borrower_finance_refresh_smoke_test.py
          python helpers/current_context_deterministic_nlg_smoke_test.py
          python helpers/data_center_metric_rollup_test.py
          python helpers/editorial_budget_smoke_test.py
          python helpers/editorial_pipeline_smoke_test.py
          python helpers/editorial_prompt_quality_smoke_test.py
          python helpers/editorial_service_smoke_test.py
          python helpers/public_language_smoke_test.py
          python helpers/snapshot_writer_smoke_test.py
          python helpers/yfinance_resilience_smoke_test.py

      - name: Verify tests did not mutate tracked state
        run: git diff --exit-code
