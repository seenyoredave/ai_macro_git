name: PE industry candidate refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '19 10 * * 2'

permissions:
  contents: read

concurrency:
  group: pe-industry-candidate-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'

      - name: Install bounded parser runtime
        run: |
          python -m pip install --disable-pip-version-check \
            'pandas==2.3.3' 'numpy==2.3.5' 'beautifulsoup4==4.14.3' \
            'openpyxl==3.1.5'

      - name: Validate fixtures and fail-closed behavior
        run: python helpers/pe_industry_pipeline_smoke_test.py

      - name: Retrieve and validate observations
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python -m loaders.pe_industry_pipeline --out-dir pe_probe_output/industry

      - name: List validated candidate observations
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd
          base = Path('pe_probe_output/industry')
          lines = ['## PE industry candidate observations', '', '| Source | Rows | Last period |', '|---|---:|---|']
          for source in ('sec', 'kpmg', 'acg'):
              path = base / f'pe_industry_{source}.csv'
              if path.exists():
                  frame = pd.read_csv(path)
                  lines.append(f'| {source.upper()} | {len(frame)} | {frame.period_end.max()} |')
              else:
                  lines.append(f'| {source.upper()} | unavailable | — |')
          lines.extend(['', 'Candidate data only. No dashboard update or repository publication.'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines) + '\n')
          PY

      - name: Upload candidate CSV files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pe-industry-candidates-${{ github.run_id }}
          path: pe_probe_output/industry/*.csv
          if-no-files-found: warn
          retention-days: 14
