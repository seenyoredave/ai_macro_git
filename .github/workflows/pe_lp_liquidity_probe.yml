name: PE LP liquidity candidate probe

on:
  workflow_dispatch:
  schedule:
    - cron: '47 11 * * 3'

permissions:
  contents: read

concurrency:
  group: pe-lp-liquidity-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'

      - name: Install bounded PDF parser
        run: python -m pip install --disable-pip-version-check 'pypdf==6.14.0' 'beautifulsoup4==4.14.3'

      - name: Check parser contracts
        run: python helpers/pe_lp_liquidity_smoke_test.py

      - name: Retrieve CalPERS private-equity cash-flow tables
        run: python -m loaders.pe_lp_liquidity_probe

      - name: Upload candidate cash-flow tables
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pe-lp-liquidity-${{ github.run_id }}
          path: pe_probe_output/liquidity/*.csv
          if-no-files-found: warn
          retention-days: 14
