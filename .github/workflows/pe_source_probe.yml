name: PE source retrieval probe

on:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * 1'

permissions:
  contents: read

concurrency:
  group: pe-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.13'

      - name: Install probe dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'pandas==2.3.3' 'beautifulsoup4==4.14.3' 'openpyxl==3.1.5' \
            'pypdf==6.14.0' 'lxml==6.1.1'

      - name: Offline validation
        run: python helpers/pe_source_probe_smoke_test.py

      - name: Probe public sources
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python helpers/pe_source_probe.py --output pe_probe_output/source_probe.json

      - name: Summarize source results
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('pe_probe_output/source_probe.json')
          lines = ['## PE source retrieval probe', '']
          if not path.exists():
              lines.append('No result file was produced; inspect the workflow logs.')
          else:
              data = json.loads(path.read_text(encoding='utf-8'))
              lines.extend(['| Source | Status | Structured data | New-release discovery |', '|---|---|---|---|'])
              for item in data['results']:
                  lines.append(f"| {item['source']} | {item['status']} | {item['structured_observations']} | {item['index_discovery']} |")
              for item in data['results']:
                  if item['errors']:
                      lines.append(f"- **{item['source']}**: " + '; '.join(item['errors'])[:500].replace('|', '/'))
              lines.extend(['', 'This test reads sources only. It does not update the dashboard or repository.'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
              stream.write('\n'.join(lines) + '\n')
          PY

      - name: Upload machine-readable results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pe-source-probe-${{ github.run_id }}
          path: pe_probe_output/source_probe.json
          if-no-files-found: warn
          retention-days: 14
